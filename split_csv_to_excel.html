<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CSV 切成 Excel</title>
  <style>
    :root {
      --bg: #f3efe6;
      --card: #fffdf8;
      --ink: #1f2430;
      --muted: #5c6474;
      --line: #d9d1c3;
      --accent: #1f5c4d;
      --accent-2: #2d7a66;
      --danger: #9b2c2c;
      --ok: #1f5c4d;
      --drop: #eef6f2;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background:
        radial-gradient(1200px 500px at 10% -10%, #e7f0ea 0%, transparent 50%),
        var(--bg);
      color: var(--ink);
      line-height: 1.55;
    }
    .wrap {
      max-width: 840px;
      margin: 0 auto;
      padding: 28px 20px 64px;
    }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 22px;
    }
    .top-text { flex: 1; min-width: 0; }
    h1 {
      font-size: 28px;
      font-weight: 700;
      margin: 0 0 8px;
      letter-spacing: 0.02em;
    }
    .lead {
      margin: 0;
      color: var(--muted);
      font-size: 16px;
    }
    .lang {
      display: flex;
      flex-shrink: 0;
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
      background: var(--card);
    }
    .lang button {
      background: transparent;
      color: var(--muted);
      border-radius: 0;
      padding: 8px 12px;
      font-weight: 650;
      font-size: 13px;
    }
    .lang button:hover { background: #f3eee4; }
    .lang button.active {
      background: var(--accent);
      color: #fff;
    }
    .modes {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .modes button {
      flex: 1;
      background: #ece6da;
      color: var(--ink);
    }
    .modes button:hover { background: #e0d8c8; }
    .modes button.active {
      background: var(--accent);
      color: #fff;
    }
    .modes button.active:hover { background: var(--accent-2); }
    body[data-mode="split"] .only-dup { display: none; }
    body[data-mode="dup"] .only-split { display: none; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(40, 32, 18, 0.06);
      padding: 22px;
    }
    .drop {
      border: 2px dashed #9bb8ae;
      background: var(--drop);
      border-radius: 14px;
      min-height: 220px;
      padding: 28px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 10px;
      transition: border-color 0.15s, background 0.15s, transform 0.15s;
      cursor: pointer;
    }
    .drop.drag {
      border-color: var(--accent);
      background: #dff0e8;
      transform: scale(1.01);
    }
    .drop.busy {
      cursor: not-allowed;
      opacity: 0.72;
    }
    .drop-title { font-size: 22px; font-weight: 700; }
    .drop-sub { color: var(--muted); font-size: 15px; }
    button {
      appearance: none;
      border: 0;
      background: var(--accent);
      color: white;
      font: inherit;
      font-weight: 650;
      padding: 10px 18px;
      border-radius: 10px;
      cursor: pointer;
    }
    button:hover { background: var(--accent-2); }
    button:disabled { cursor: not-allowed; opacity: 0.55; }
    .btn-secondary {
      background: #ece6da;
      color: var(--ink);
    }
    .btn-secondary:hover { background: #e0d8c8; }
    .controls {
      margin-top: 16px;
      display: grid;
      gap: 14px;
      padding: 14px 4px 4px;
      border-top: 1px solid var(--line);
    }
    .field-label {
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 8px;
    }
    .row-picks {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .row-picks label.chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 12px;
      background: #fff;
      cursor: pointer;
      font-size: 14px;
    }
    .row-picks label.chip:has(input:checked) {
      border-color: var(--accent);
      background: #e7f4ee;
      font-weight: 650;
    }
    .row-picks input[type="radio"] { accent-color: var(--accent); }
    .custom-wrap {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    #customRows {
      width: 8.5rem;
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font: inherit;
    }
    .check {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      cursor: pointer;
    }
    .check input { accent-color: var(--accent); width: 16px; height: 16px; }
    .preview {
      display: none;
      margin-top: 16px;
      padding: 14px 16px;
      border-radius: 12px;
      background: #eef6f2;
      border: 1px solid #cfe0d7;
    }
    .preview.show { display: block; }
    .preview-name { font-weight: 700; word-break: break-all; }
    .preview-meta { color: var(--muted); font-size: 14px; margin-top: 4px; }
    .preview-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }
    .status {
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: 12px;
      background: #f7f4ee;
      color: var(--ink);
      min-height: 52px;
      white-space: pre-wrap;
    }
    .status.err { background: #fdeeee; color: var(--danger); }
    .status.ok { background: #e7f4ee; color: var(--ok); }
    .report {
      display: none;
      margin-top: 18px;
      padding: 16px;
      border-radius: 12px;
      background: #fff;
      border: 1px solid var(--line);
    }
    .report.show { display: block; }
    .report h2 {
      font-size: 18px;
      margin: 0 0 12px;
    }
    .summary-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }
    .pill {
      background: #eef6f2;
      border: 1px solid #cfe0d7;
      border-radius: 999px;
      padding: 4px 12px;
      font-size: 13px;
      font-weight: 650;
    }
    .report-ok {
      color: var(--ok);
      font-weight: 700;
      margin: 8px 0 0;
    }
    .fail-box {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #fdeeee;
      color: var(--danger);
      font-size: 13px;
    }
    .fail-box ul { margin: 8px 0 0; padding-left: 1.2em; }
    .dup-block { margin-top: 16px; }
    .dup-block h3 {
      font-size: 15px;
      margin: 0 0 8px;
    }
    .dup-item {
      padding: 8px 10px;
      border-top: 1px solid var(--line);
      font-size: 13px;
    }
    .dup-key {
      font-weight: 650;
      word-break: break-all;
    }
    .dup-meta {
      color: var(--muted);
      font-size: 12px;
      margin-top: 2px;
      word-break: break-all;
    }
    .dup-more {
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
    }
    .bar {
      margin-top: 12px;
      height: 10px;
      background: #e6e0d4;
      border-radius: 99px;
      overflow: hidden;
      display: none;
    }
    .bar.show { display: block; }
    .bar > span {
      display: block;
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.2s;
    }
    .hints {
      margin: 18px 4px 0;
      color: var(--muted);
      font-size: 14px;
    }
    .hints li { margin: 6px 0; }
    input[type="file"] { display: none; }
    fieldset {
      border: 0;
      margin: 0;
      padding: 0;
      min-width: 0;
    }
    fieldset:disabled { opacity: 0.55; }
  </style>
</head>
<body data-mode="split">
  <div class="wrap">
    <div class="top">
      <div class="top-text">
        <h1 id="title"></h1>
        <p class="lead" id="lead"></p>
      </div>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" id="langZh">中文</button>
        <button type="button" id="langEn">English</button>
      </div>
    </div>
    <div class="card">
      <div class="modes" role="tablist">
        <button type="button" id="modeSplit" role="tab" aria-selected="true"></button>
        <button type="button" id="modeDup" role="tab" aria-selected="false"></button>
      </div>
      <div id="drop" class="drop" role="button" tabindex="0">
        <div class="drop-title" id="dropTitle"></div>
        <div class="drop-sub" id="dropSub"></div>
        <button id="pick" type="button"></button>
      </div>
      <fieldset id="settings">
        <div class="controls only-split">
          <div>
            <div class="field-label" id="rowsLabel"></div>
            <div class="row-picks">
              <label class="chip"><input type="radio" name="rows" value="100000" /> <span id="rows100k"></span></label>
              <label class="chip"><input type="radio" name="rows" value="500000" checked /> <span id="rows500k"></span></label>
              <label class="chip"><input type="radio" name="rows" value="1000000" /> <span id="rows1m"></span></label>
              <label class="chip custom-wrap">
                <input type="radio" name="rows" value="custom" />
                <span id="rowsCustom"></span>
                <input id="customRows" type="number" min="1" step="1" inputmode="numeric" />
              </label>
            </div>
          </div>
          <label class="check">
            <input id="includeHeader" type="checkbox" checked />
            <span id="headerLabel"></span>
          </label>
        </div>
        <div class="controls only-dup">
          <label class="check">
            <input id="dupHeader" type="checkbox" checked />
            <span id="dupHeaderLabel"></span>
          </label>
        </div>
      </fieldset>
      <div id="preview" class="preview">
        <div class="preview-name" id="previewName"></div>
        <div class="preview-meta" id="previewMeta"></div>
        <div class="preview-actions">
          <button id="startBtn" type="button"></button>
          <button id="clearBtn" type="button" class="btn-secondary"></button>
        </div>
      </div>
      <div id="bar" class="bar" aria-hidden="true"><span id="barFill"></span></div>
      <div id="status" class="status"></div>
      <div id="report" class="report"></div>
    </div>
    <ul class="hints">
      <li id="hint1"></li>
      <li id="hint2"></li>
      <li id="hint3"></li>
    </ul>
  </div>
  <input id="file" type="file" accept=".csv,text/csv" />
  <input id="folder" type="file" webkitdirectory directory multiple />

        var nextCol = 0;
        while ((m = re.exec(rowXml))) {
          var attrs = m[1] || "";
          var inner = m[2] || "";
          var ref = xmlAttr(attrs, "r");
          var col = ref ? colIndexFromRef(ref) : nextCol;
          var typ = xmlAttr(attrs, "t").toLowerCase();
          var val = "";
          if (typ === "inlinestr") val = extractTTexts(inner);
          else if (typ === "s") {
            var idx = Number(extractV(inner));
            val = shared && idx >= 0 && shared[idx] != null ? String(shared[idx]) : "";
          } else if (typ === "str") val = extractV(inner) || extractTTexts(inner);
          else val = extractV(inner);
          cells[col] = val;
          nextCol = col + 1;
        }
        for (var i = 0; i < cells.length; i++) {
          if (cells[i] == null) cells[i] = "";
        }
        return cells;
      }

      function parseZip(u8) {
        var view = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
        var eocd = -1;
        var min = Math.max(0, u8.length - 65557);
        for (var i = u8.length - 22; i >= min; i--) {
          if (view.getUint32(i, true) === 0x06054b50) {
            eocd = i;
            break;
          }
        }
        if (eocd < 0) throw new Error("NOT_ZIP");
        var cdCount = view.getUint16(eocd + 10, true);
        var cdOffset = view.getUint32(eocd + 16, true);
        if (cdCount === 0xffff || cdOffset === 0xffffffff) throw new Error("UNSUPPORTED_ZIP");
        var entries = {};
        var pos = cdOffset;
        for (var n = 0; n < cdCount; n++) {
          if (view.getUint32(pos, true) !== 0x02014b50) throw new Error("NOT_ZIP");
          var method = view.getUint16(pos + 10, true);
          var compressedSize = view.getUint32(pos + 20, true);
          var nameLen = view.getUint16(pos + 28, true);
          var extraLen = view.getUint16(pos + 30, true);
          var commentLen = view.getUint16(pos + 32, true);
          var localOffset = view.getUint32(pos + 42, true);
          if (compressedSize === 0xffffffff || localOffset === 0xffffffff) {
            throw new Error("UNSUPPORTED_ZIP");
          }
          var name = new TextDecoder("utf-8")
            .decode(u8.subarray(pos + 46, pos + 46 + nameLen))
            .replace(/\\/g, "/")
            .replace(/^\//, "");
          var rec = { method: method, compressedSize: compressedSize, localOffset: localOffset };
          entries[name] = rec;
          var low = name.toLowerCase();
          if (low !== name) entries[low] = rec;
          pos += 46 + nameLen + extraLen + commentLen;
        }
        return { u8: u8, view: view, entries: entries };
      }

      function zipEntryBytes(zip, path) {
        var rec = zip.entries[path] || zip.entries[String(path).toLowerCase()];
        if (!rec) return null;
        var off = rec.localOffset;
        if (zip.view.getUint32(off, true) !== 0x04034b50) throw new Error("NOT_ZIP");
        var nameLen = zip.view.getUint16(off + 26, true);
        var extraLen = zip.view.getUint16(off + 28, true);
        var start = off + 30 + nameLen + extraLen;
        return {
          method: rec.method,
          data: zip.u8.subarray(start, start + rec.compressedSize)
        };
      }

      function zipHas(zip, path) {
        return !!(zip.entries[path] || zip.entries[String(path).toLowerCase()]);
      }

      async function inflateEntry(entry) {
        if (!entry) return null;
        if (entry.method === 0) return entry.data;
        if (entry.method !== 8) throw new Error("UNSUPPORTED_ZIP");
        if (typeof DecompressionStream !== "function") throw new Error("OLD_BROWSER");
        var stream = new Blob([entry.data]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
        var reader = stream.getReader();
        var parts = [];
        var total = 0;
        while (true) {
          var step = await reader.read();
          if (step.done) break;
          parts.push(step.value);
          total += step.value.length;
        }
        var out = new Uint8Array(total);
        var o = 0;
        for (var i = 0; i < parts.length; i++) {
          out.set(parts[i], o);
          o += parts[i].length;
        }
        return out;
      }

      async function zipText(zip, path) {
        var entry = zipEntryBytes(zip, path);
        if (!entry) return "";
        var bytes = await inflateEntry(entry);
        return new TextDecoder("utf-8").decode(bytes);
      }

      async function inflateToTextChunks(entry, onText) {
        var decoder = new TextDecoder("utf-8");
        if (entry.method === 0) {
          var pos = 0;
          var size = 1 << 20;
          while (pos < entry.data.length) {
            await onText(decoder.decode(entry.data.subarray(pos, pos + size), { stream: true }));
            pos += size;
            await maybeYield();
          }
          var tail = decoder.decode();
          if (tail) await onText(tail);
          return;
        }
        if (entry.method !== 8) throw new Error("UNSUPPORTED_ZIP");
        if (typeof DecompressionStream !== "function") throw new Error("OLD_BROWSER");
        var stream = new Blob([entry.data]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
        var reader = stream.getReader();
        while (true) {
          var step = await reader.read();
          if (step.done) {
            var end = decoder.decode();
            if (end) await onText(end);
            break;
          }
          await onText(decoder.decode(step.value, { stream: true }));
        }
      }

      function findTagOpen(buf, tag, from) {
        var token = "<" + tag;
        var i = from || 0;
        while (i < buf.length) {
          var p = buf.indexOf(token, i);
          var ns = false;
          if (p === -1) {
            var p2 = buf.indexOf(":" + tag, i);
            if (p2 === -1) return -1;
            var lt = buf.lastIndexOf("<", p2);
            if (lt === -1 || p2 - lt > 14) {
              i = p2 + 1;
              continue;
            }
            p = lt;
            ns = true;
          }
          var after = ns ? buf.indexOf(tag, p) + tag.length : p + token.length;
          var c = buf.charCodeAt(after);
          if (c === 32 || c === 9 || c === 10 || c === 13 || c === 62 || c === 47) return p;
          i = p + 1;
        }
        return -1;
      }

      function findTagClose(buf, tag, from) {
        var token = "</" + tag + ">";
        var p = buf.indexOf(token, from);
        if (p !== -1) return { at: p, len: token.length };
        var needle = ":" + tag + ">";
        var p2 = buf.indexOf(needle, from);
        while (p2 !== -1) {
          var lt = buf.lastIndexOf("</", p2);
          if (lt !== -1 && lt >= from && p2 - lt < 16) {
            return { at: lt, len: p2 + tag.length + 1 - lt };
          }
          p2 = buf.indexOf(needle, p2 + 1);
        }
        return null;
      }

      function XmlTagReader(tag) {
        this.tag = tag;
        this.buf = "";
      }

      XmlTagReader.prototype.push = function (text, onTag) {
        this.buf += text;
        var buf = this.buf;
        var tag = this.tag;
        while (true) {
          var start = findTagOpen(buf, tag, 0);
          if (start === -1) {
            this.buf = buf.length > 32 ? buf.slice(-16) : buf;
            return;
          }
          if (start > 0) buf = buf.slice(start);
          var gt = buf.indexOf(">");
          if (gt === -1) {
            this.buf = buf;
            return;
          }
          if (buf.charAt(gt - 1) === "/") {
            onTag("");
            buf = buf.slice(gt + 1);
            continue;
          }
          var close = findTagClose(buf, tag, gt);
          if (!close) {
            if (buf.length > 4 * 1024 * 1024) buf = buf.slice(1024 * 1024);
            this.buf = buf;
            return;
          }
          onTag(buf.slice(0, close.at + close.len));
          buf = buf.slice(close.at + close.len);
        }
      };

      XmlTagReader.prototype.flush = function (onTag) {
        if (!this.buf) return;
        var start = findTagOpen(this.buf, this.tag, 0);
        if (start !== -1) {
          var gt = this.buf.indexOf(">", start);
          if (gt !== -1 && this.buf.charAt(gt - 1) === "/") onTag("");
        }
        this.buf = "";
      };

      function resolveXlTarget(target) {
        var p = String(target || "").replace(/\\/g, "/").replace(/^\.\//, "");
        if (!p) return "";
        if (p.charAt(0) === "/") return p.replace(/^\/+/, "");
        if (p.indexOf("xl/") === 0) return p;
        return "xl/" + p;
      }

      async function firstSheetEntry(zip) {
        var relsXml = zipHas(zip, "xl/_rels/workbook.xml.rels")
          ? await zipText(zip, "xl/_rels/workbook.xml.rels")
          : "";
        var wbXml = zipHas(zip, "xl/workbook.xml") ? await zipText(zip, "xl/workbook.xml") : "";
        var rels = {};
        var rm = /<Relationship\b([^>]*)\/?>/gi;
        var m;
        while ((m = rm.exec(relsXml))) {
          rels[xmlAttr(m[1], "Id")] = {
            type: xmlAttr(m[1], "Type"),
            target: xmlAttr(m[1], "Target")
          };
        }
        var sm = /<sheet\b([^>]*)\/?>/gi;
        while ((m = sm.exec(wbXml))) {
          var rid = xmlAttr(m[1], "r:id") || xmlAttr(m[1], "r:Id");
          var rel = rels[rid];
          if (rel && /worksheet/i.test(rel.type)) {
            var path = resolveXlTarget(rel.target);
            var entry = zipEntryBytes(zip, path);
            if (entry) return entry;
          }
        }
        var seen = {};
        var names = Object.keys(zip.entries);
        for (var i = 0; i < names.length; i++) {
          var nm = names[i];
          var low = nm.toLowerCase();
          if (seen[low]) continue;
          seen[low] = true;
          if (/^xl\/worksheets\/.+\.xml$/i.test(nm)) return zipEntryBytes(zip, nm);
        }
        throw new Error("NO_SHEET");
      }

      function addHit(map, key, fileIdx) {
        var rec = map.get(key);
        if (!rec) {
          map.set(key, { c: 1, f: [fileIdx] });
        } else {
          rec.c += 1;
          if (rec.f[rec.f.length - 1] !== fileIdx) rec.f.push(fileIdx);
        }
      }

      function rowKey(cells) {
        var end = cells.length;
        while (end > 0 && String(cells[end - 1]) === "") end--;
        if (!end) return "";
        return cells.slice(0, end).join(ROW_SEP);
      }

      async function scanOneXlsx(file, fileIdx, ctx) {
        var buf = new Uint8Array(await file.arrayBuffer());
        var zip = parseZip(buf);
        var shared = [];
        var sst = zipEntryBytes(zip, "xl/sharedStrings.xml");
        if (sst) {
          var siReader = new XmlTagReader("si");
          await inflateToTextChunks(sst, function (text) {
            siReader.push(text, function (xml) {
              shared.push(extractTTexts(xml));
            });
          });
          siReader.flush(function (xml) {
            if (xml) shared.push(extractTTexts(xml));
          });
        }
        var sheet = await firstSheetEntry(zip);
        var rowReader = new XmlTagReader("row");
        var first = true;

        function consumeRow(xml) {
          if (!xml) return false;
          var cells = parseRowCells(xml, shared);
          if (first && ctx.useHeader) {
            first = false;
            if (!ctx.headerLocked) {
              ctx.headers = [];
              for (var h = 0; h < cells.length; h++) ctx.headers.push(String(cells[h] || "").trim());
              ctx.headerLocked = true;
            }
            return false;
          }
          first = false;
          var key = rowKey(cells);
          if (!key) return false;
          ctx.totalRows += 1;
          addHit(ctx.rowMap, key, fileIdx);
          for (var c = 0; c < cells.length; c++) {
            var val = String(cells[c] == null ? "" : cells[c]).trim();
            if (!val) continue;
            if (!ctx.colMaps[c]) {
              ctx.colMaps[c] = {
                name: ctx.headers[c] ? String(ctx.headers[c]).trim() : "",
                map: new Map()
              };
            }
            addHit(ctx.colMaps[c].map, val, fileIdx);
          }
          if ((ctx.totalRows & 8191) === 0) {
            if (ctx.onProgress) ctx.onProgress();
            return true;
          }
          return false;
        }

        await inflateToTextChunks(sheet, async function (text) {
          var batch = [];
          rowReader.push(text, function (xml) { batch.push(xml); });
          for (var i = 0; i < batch.length; i++) {
            if (consumeRow(batch[i])) await maybeYield();
          }
        });
        var leftover = [];
        rowReader.flush(function (xml) { leftover.push(xml); });
        for (var j = 0; j < leftover.length; j++) {
          if (consumeRow(leftover[j])) await maybeYield();
        }
      }

      function collectDupGroups(map) {
        var groups = [];
        map.forEach(function (rec, key) {
          if (rec.c > 1) groups.push({ key: key, count: rec.c, files: rec.f.slice() });
        });
        groups.sort(function (a, b) {
          if (b.count !== a.count) return b.count - a.count;
          return a.key < b.key ? -1 : a.key > b.key ? 1 : 0;
        });
        return { total: groups.length, shown: groups.slice(0, DUP_SHOW) };
      }

      async function scanXlsxFiles(items, useHeader, onProgress) {
        var ctx = {
          useHeader: !!useHeader,
          headerLocked: false,
          headers: [],
          rowMap: new Map(),
          colMaps: [],
          totalRows: 0,
          onProgress: null
        };
        var failed = [];
        var lastUi = 0;
        for (var i = 0; i < items.length; i++) {
          var item = items[i];
          onProgress(Math.min(i + 1, items.length), items.length, ctx.totalRows, item.path);
          ctx.onProgress = function () {
            var now = performance.now();
            if (now - lastUi < 250) return;
            lastUi = now;
            onProgress(Math.min(i + 1, items.length), items.length, ctx.totalRows, item.path);
          };
          try {
            await scanOneXlsx(item.file, i, ctx);
          } catch (err) {
            failed.push({ path: item.path, msg: mapError(err) });
          }
          await maybeYield();
        }
        onProgress(items.length, items.length, ctx.totalRows, items.length ? items[items.length - 1].path : "");
        var columns = [];
        for (var c = 0; c < ctx.colMaps.length; c++) {
          var col = ctx.colMaps[c];
          if (!col) continue;
          var dups = collectDupGroups(col.map);
          columns.push({
            name: col.name,
            index: c,
            total: dups.total,
            shown: dups.shown
          });
        }
        return {
          files: items.length,
          rows: ctx.totalRows,
          failed: failed,
          rowDups: collectDupGroups(ctx.rowMap),
          columns: columns,
          items: items
        };
      }

      function colDisplayName(name, index) {
        if (name) return name;
        return tf("colFallback", { n: String(index + 1) });
      }

      function displayRowKey(key) {
        return String(key).split(ROW_SEP).join(" | ");
      }

      function shorten(s, n) {
        s = String(s);
        if (s.length <= n) return s;
        return s.slice(0, n) + "…";
      }

      function escapeHtml(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function fileNamesFromIdx(idxs, items) {
        var names = [];
        for (var i = 0; i < idxs.length; i++) {
          var it = items[idxs[i]];
          names.push(it ? it.path : String(idxs[i]));
        }
        return names.join(lang === "en" ? ", " : "、");
      }

      function renderDupItems(groups, keyFn, items) {
        var html = "";
        for (var i = 0; i < groups.shown.length; i++) {
          var g = groups.shown[i];
          var keyText = keyFn(g.key);
          html +=
            '<div class="dup-item"><div class="dup-key" title="' + escapeHtml(keyText) + '">' +
            escapeHtml(shorten(keyText, 240)) + "</div>" +
            '<div class="dup-meta">' + escapeHtml(tf("dupCount", { count: String(g.count) })) +
            " · " + escapeHtml(tf("dupFiles", { files: fileNamesFromIdx(g.files, items) })) +
            "</div></div>";
        }
        if (groups.total > groups.shown.length) {
          html += '<div class="dup-more">' + escapeHtml(tf("dupMore", {
            n: String(groups.total - groups.shown.length),
            limit: String(DUP_SHOW)
          })) + "</div>";
        }
        return html;
      }

      function hasAnyDup(report) {
        if (!report) return false;
        if (report.rowDups.total > 0) return true;
        for (var i = 0; i < report.columns.length; i++) {
          if (report.columns[i].total > 0) return true;
        }
        return false;
      }

      function renderReport() {
        if (!lastReport || mode !== "dup") {
          reportEl.classList.remove("show");
          reportEl.innerHTML = "";
          return;
        }
        var r = lastReport;
        var items = r.items || [];
        var html = "<h2>" + escapeHtml(t("reportTitle")) + "</h2>";
        html += '<div class="summary-grid">';
        html += '<span class="pill">' + escapeHtml(tf("summaryFiles", { n: String(r.files) })) + "</span>";
        html += '<span class="pill">' + escapeHtml(tf("summaryRows", { n: r.rows.toLocaleString(locale()) })) + "</span>";
        html += '<span class="pill">' + escapeHtml(tf("summaryRowDup", { n: String(r.rowDups.total) })) + "</span>";
        for (var c = 0; c < r.columns.length; c++) {
          var col = r.columns[c];
          html += '<span class="pill">' + escapeHtml(tf("summaryColDup", {
            name: colDisplayName(col.name, col.index),
            n: String(col.total)
          })) + "</span>";
        }
        html += "</div>";
        if (!hasAnyDup(r)) {
          html += '<p class="report-ok">' + escapeHtml(t("noDup")) + "</p>";
        } else {
          if (r.rowDups.total) {
            html += '<div class="dup-block"><h3>' + escapeHtml(tf("dupRowTitle", { n: String(r.rowDups.total) })) + "</h3>";
            html += renderDupItems(r.rowDups, displayRowKey, items) + "</div>";
          }
          for (var j = 0; j < r.columns.length; j++) {
            var col2 = r.columns[j];
            if (!col2.total) continue;
            html += '<div class="dup-block"><h3>' + escapeHtml(tf("dupColTitle", {
              name: colDisplayName(col2.name, col2.index),
              n: String(col2.total)
            })) + "</h3>";
            html += renderDupItems(col2, function (k) { return k; }, items) + "</div>";
          }
        }
        if (r.failed && r.failed.length) {
          html += '<div class="fail-box"><div>' + escapeHtml(tf("failedTitle", { n: String(r.failed.length) })) + "</div><ul>";
          for (var f = 0; f < r.failed.length; f++) {
            html += "<li>" + escapeHtml(r.failed[f].path + " — " + r.failed[f].msg) + "</li>";
          }
          html += "</ul></div>";
        }
        reportEl.innerHTML = html;
        reportEl.classList.add("show");
      }

      async function processFile(file, rowsPerFile, includeHeader) {
        var decoder = new TextDecoder("utf-8");
        var csv = createCsvState();
        var chunks = await readChunks(file);
        var header = null;
        var totalRows = 0;
        var part = 0;
        var rowsInPart = 0;
        var bytes = 0;
        var outer = new ZipWriter();
        var sheet = null;
        var lastUi = 0;

        function ui(msg, force) {
          var now = performance.now();
          if (!force && now - lastUi < 250) return;
          lastUi = now;
          var pct = file.size ? Math.min(100, Math.round((bytes / Math.max(file.size, 1)) * 100)) : 0;
          setProgress(file.size ? (bytes / file.size) * 88 : 0);
          progressSnap = {
            msg: msg,
            pct: pct,
            rows: totalRows,
            parts: part
          };
          statusKind = "";
          renderStatus();
        }

        async function closePart() {
          if (!sheet || !rowsInPart) {
            sheet = null;
            rowsInPart = 0;
            return;
          }
          part += 1;
          ui(tf("writingPart", { name: "part_" + padPart(part) + ".xlsx" }), true);
          var xlsxBytes = await finishXlsx(sheet);
          outer.addStored("part_" + padPart(part) + ".xlsx", xlsxBytes);
          sheet = null;
          rowsInPart = 0;
          await maybeYield();
        }

        async function consume(rows) {
          for (var i = 0; i < rows.length; i++) {
            var row = rows[i];
            if (header == null) {
              if (row[0] && row[0].charCodeAt(0) === 0xFEFF) row[0] = row[0].slice(1);
              header = row;
              continue;
            }
            if (!sheet) {
              sheet = await startSheet(header, includeHeader);
            }
            rowsInPart += 1;
            totalRows += 1;
            var excelRow = includeHeader ? rowsInPart : rowsInPart - 1;
            var p = sheet.write(rowXml(excelRow, row));
            if (p) await p;
            if (rowsInPart >= rowsPerFile) await closePart();
            else if ((totalRows & 16383) === 0) {
              ui(t("writingExcel"));
              await maybeYield();
            }
          }
        }

        while (true) {
          var step = await chunks.next();
          var rows = [];
          if (step.done) {
            var tail = decoder.decode();
            if (tail) parseText(csv, tail, rows);
            flushCsv(csv, rows);
            await consume(rows);
            break;
          }
          bytes += step.value.length;
          var text = decoder.decode(step.value, { stream: true });
          parseText(csv, text, rows);
          await consume(rows);
          ui(t("reading"));
        }

        if (!header) throw new Error("NO_HEADER");
        await closePart();
        if (!part || totalRows === 0) throw new Error("NO_DATA");

        setProgress(96);
        progressSnap = null;
        setStatusKey("packing", {
          rowsRaw: totalRows,
          parts: part
        });
        var zipBlob = outer.finish();
        var zipName = baseName(file.name) + "_excel_" + stamp() + ".zip";
        downloadBlob(zipBlob, zipName);
        setProgress(100);
        setStatusKey("done", {
          parts: part,
          rowsRaw: totalRows,
          zip: zipName
        }, "ok");
      }

      function downloadBlob(blob, name) {
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = name;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 15000);
      }

      function mapError(err) {
        var raw = err && err.message ? err.message : String(err);
        if (raw === "OLD_BROWSER") return t("oldBrowser");
        if (raw === "NO_HEADER") return t("noHeader");
        if (raw === "NO_DATA") return t("noData");
        if (raw === "NOT_ZIP") return t("notZip");
        if (raw === "NO_SHEET") return t("noSheet");
        if (raw === "UNSUPPORTED_ZIP") return t("unsupportedZip");
        if (/memory|heap|allocation/i.test(raw)) return t("memory");
        return raw;
      }

      function estimateParts(file, rowsPerFile) {
        if (!file || !rowsPerFile) return 1;
        var estRows = Math.max(1, Math.round(file.size / 56) - 1);
        return Math.max(1, Math.ceil(estRows / rowsPerFile));
      }

      function renderPreview() {
        if (mode === "dup") {
          if (!selectedXlsx.length) {
            preview.classList.remove("show");
            return;
          }
          preview.classList.add("show");
          previewName.textContent = folderLabel || (selectedXlsx.length === 1
            ? selectedXlsx[0].path
            : tf("summaryFiles", { n: String(selectedXlsx.length) }));
          var bytes = 0;
          var names = [];
          for (var i = 0; i < selectedXlsx.length; i++) {
            bytes += selectedXlsx[i].file.size;
            if (names.length < 8) names.push(selectedXlsx[i].path.split("/").pop());
          }
          var meta = tf("previewMetaDup", {
            files: String(selectedXlsx.length),
            size: formatSize(bytes)
          });
          var joined = names.join(lang === "en" ? ", " : "、");
          if (selectedXlsx.length > names.length) {
            meta += "\n" + tf("previewFilesMoreDup", { names: joined, files: String(selectedXlsx.length) });
          } else {
            meta += "\n" + tf("previewFilesDup", { names: joined });
          }
          previewMeta.textContent = meta;
          return;
        }
        if (!selectedFile) {
          preview.classList.remove("show");
          return;
        }
        preview.classList.add("show");
        previewName.textContent = selectedFile.name;
        var rows = parseRowsPerFile() || 500000;
        previewMeta.textContent = tf("previewMeta", {
          size: formatSize(selectedFile.size),
          parts: String(estimateParts(selectedFile, rows))
        });
      }

      function fileRelPath(file) {
        return file._rel || file.webkitRelativePath || file.name || "";
      }

      function isTempExcelName(path) {
        var base = String(path).split(/[/\\]/).pop() || "";
        return base.indexOf("~$") === 0;
      }

      function isXlsxPath(path) {
        return /\.xlsx$/i.test(path) && !isTempExcelName(path);
      }

      function readDirEntries(reader) {
        return new Promise(function (resolve, reject) {
          var all = [];
          function next() {
            reader.readEntries(function (batch) {
              if (!batch.length) return resolve(all);
              all.push.apply(all, batch);
              next();
            }, reject);
          }
          next();
        });
      }

      function fileFromEntry(entry) {
        return new Promise(function (resolve, reject) {
          entry.file(function (file) {
            var rel = String(entry.fullPath || file.name || "").replace(/^\//, "");
            try {
              Object.defineProperty(file, "_rel", { value: rel, configurable: true });
            } catch (e) {
              file._rel = rel;
            }
            resolve(file);
          }, reject);
        });
      }

      async function walkEntry(entry, out) {
        if (!entry) return;
        if (entry.isFile) {
          out.push(await fileFromEntry(entry));
          return;
        }
        if (entry.isDirectory) {
          var kids = await readDirEntries(entry.createReader());
          for (var i = 0; i < kids.length; i++) await walkEntry(kids[i], out);
        }
      }

      async function filesFromDataTransfer(dt) {
        if (!dt) return [];
        var items = dt.items;
        var entries = [];
        if (items && items.length && items[0].webkitGetAsEntry) {
          for (var i = 0; i < items.length; i++) {
            var entry = items[i].webkitGetAsEntry && items[i].webkitGetAsEntry();
            if (entry) entries.push(entry);
          }
        }
        if (entries.length) {
          var files = [];
          for (var j = 0; j < entries.length; j++) await walkEntry(entries[j], files);
          if (files.length) return files;
        }
        return Array.prototype.slice.call(dt.files || []);
      }

      function inferFolderLabel(items) {
        if (!items.length) return "";
        var first = items[0].path;
        var slash = first.indexOf("/");
        if (slash <= 0) return "";
        var root = first.slice(0, slash);
        for (var i = 1; i < items.length; i++) {
          if (items[i].path !== root && items[i].path.indexOf(root + "/") !== 0) return "";
        }
        return root;
      }

      function chooseXlsx(files) {
        lastReport = null;
        var list = [];
        for (var i = 0; i < files.length; i++) {
          var f = files[i];
          var p = String(fileRelPath(f)).replace(/\\/g, "/");
          if (isXlsxPath(p)) list.push({ file: f, path: p });
        }
        if (!list.length) {
          selectedXlsx = [];
          folderLabel = "";
          renderPreview();
          renderReport();
          setStatusKey("needXlsx", {}, "err");
          return;
        }
        list.sort(function (a, b) {
          return a.path < b.path ? -1 : a.path > b.path ? 1 : 0;
        });
        selectedXlsx = list;
        folderLabel = inferFolderLabel(list);
        hideProgress();
        renderPreview();
        renderReport();
        setStatusKey("idleDup");
      }

      function clearFile() {
        selectedFile = null;
        skippedExtra = false;
        fileInput.value = "";
        preview.classList.remove("show");
        hideProgress();
        setStatusKey("idle");
      }

      function clearSelection() {
        if (mode === "dup") {
          selectedXlsx = [];
          folderLabel = "";
          lastReport = null;
          folderInput.value = "";
          preview.classList.remove("show");
          hideProgress();
          renderReport();
          setStatusKey("idleDup");
          return;
        }
        clearFile();
      }

      function chooseFile(file, extra) {
        selectedFile = file;
        skippedExtra = !!extra;
        hideProgress();
        renderPreview();
        if (extra) setStatusKey("extraFiles", { name: file.name });
        else setStatusKey("idle");
      }

      function setMode(next) {
        if (busy) return;
        var nextMode = next === "dup" ? "dup" : "split";
        if (mode === nextMode) return;
        mode = nextMode;
        hideProgress();
        progressSnap = null;
        if (mode === "dup") setStatusKey("idleDup");
        else setStatusKey(selectedFile ? "idle" : "idle");
        applyI18n();
      }

      function lockUi(on) {
        busy = on;
        settings.disabled = on;
        pick.disabled = on;
        startBtn.disabled = on;
        clearBtn.disabled = on;
        modeSplitBtn.disabled = on;
        modeDupBtn.disabled = on;
        if (on) drop.classList.add("busy");
        else drop.classList.remove("busy");
      }

      function openPicker() {
        if (busy) return;
        if (mode === "dup") folderInput.click();
        else fileInput.click();
      }

      async function startScan() {
        if (busy) return;
        if (!selectedXlsx.length) {
          setStatusKey("needFolder", {}, "err");
          return;
        }
        lockUi(true);
        window.onbeforeunload = function () { return t("leave"); };
        setProgress(1);
        lastReport = null;
        renderReport();
        setStatusKey("startScanMsg", { files: selectedXlsx.length });
        try {
          var report = await scanXlsxFiles(selectedXlsx, dupHeaderEl.checked, function (done, total, rows, name) {
            var pct = total ? Math.min(99, ((done + 0.2) / total) * 100) : 0;
            setProgress(pct);
            progressSnap = {
              kind: "dup",
              msg: tf("progressFile", { name: name || "" }),
              done: done,
              total: total,
              rows: rows
            };
            statusKind = "";
            renderStatus();
          });
          lastReport = report;
          setProgress(100);
          progressSnap = null;
          var kind = report.failed.length && report.rows === 0 ? "err" : "ok";
          setStatusKey("scanDone", {
            files: report.files,
            rowsRaw: report.rows
          }, kind);
          renderReport();
        } catch (err) {
          hideProgress();
          setStatusKey("fail", { msg: mapError(err) }, "err");
        } finally {
          lockUi(false);
          window.onbeforeunload = null;
        }
      }

      async function startSplit() {
        if (busy) return;
        if (!selectedFile) {
          setStatusKey("needCsv", {}, "err");
          return;
        }
        var rowsPerFile = parseRowsPerFile();
        if (!rowsPerFile) {
          setStatusKey("badRows", { max: String(maxDataRows()) }, "err");
          return;
        }
        lockUi(true);
        window.onbeforeunload = function () { return t("leave"); };
        setProgress(1);
        setStatusKey("startMsg", { name: selectedFile.name });
        try {
          await processFile(selectedFile, rowsPerFile, headerOn());
        } catch (err) {
          hideProgress();
          setStatusKey("fail", { msg: mapError(err) }, "err");
        } finally {
          lockUi(false);
          window.onbeforeunload = null;
        }
      }

      function pickFromList(files) {
        if (busy) {
          setStatusKey("busyWait");
          return;
        }
        var list = Array.prototype.slice.call(files || []);
        if (!list.length) return;
        var csvs = list.filter(isCsv);
        if (!csvs.length) {
          setStatusKey("needCsvOther", {}, "err");
          return;
        }
        chooseFile(csvs[0], list.length > 1);
      }

      function handleIncoming(dt) {
        Promise.resolve().then(function () {
          if (busy) {
            setStatusKey("busyWait");
            return;
          }
          if (mode === "dup") {
            return filesFromDataTransfer(dt).then(function (files) {
              if (!files.length) {
                setStatusKey("needFolder", {}, "err");
                return;
              }
              chooseXlsx(files);
            });
          }
          pickFromList(dt && dt.files);
        }).catch(function (err) {
          setStatusKey("fail", { msg: mapError(err) }, "err");
        });
      }

      drop.addEventListener("dragenter", function (e) {
        e.preventDefault();
        if (!busy) drop.classList.add("drag");
      });
      drop.addEventListener("dragover", function (e) {
        e.preventDefault();
        if (!busy) drop.classList.add("drag");
      });
      drop.addEventListener("dragleave", function (e) {
        if (e.target === drop) drop.classList.remove("drag");
      });
      drop.addEventListener("drop", function (e) {
        e.preventDefault();
        drop.classList.remove("drag");
        handleIncoming(e.dataTransfer);
      });
      document.addEventListener("dragover", function (e) { e.preventDefault(); });
      document.addEventListener("drop", function (e) {
        if (e.target === drop || drop.contains(e.target)) return;
        e.preventDefault();
        handleIncoming(e.dataTransfer);
      });

      pick.addEventListener("click", function (e) {
        e.preventDefault();
        e.stopPropagation();
        openPicker();
      });
      drop.addEventListener("click", function (e) {
        if (e.target === pick) return;
        openPicker();
      });
      drop.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          openPicker();
        }
      });
      fileInput.addEventListener("change", function () {
        pickFromList(fileInput.files);
        fileInput.value = "";
      });
      folderInput.addEventListener("change", function () {
        chooseXlsx(Array.prototype.slice.call(folderInput.files || []));
        folderInput.value = "";
      });
      startBtn.addEventListener("click", function (e) {
        e.preventDefault();
        if (mode === "dup") startScan();
        else startSplit();
      });
      clearBtn.addEventListener("click", function (e) {
        e.preventDefault();
        if (!busy) clearSelection();
      });
      modeSplitBtn.addEventListener("click", function () { setMode("split"); });
      modeDupBtn.addEventListener("click", function () { setMode("dup"); });
      document.querySelectorAll('input[name="rows"]').forEach(function (el) {
        el.addEventListener("change", function () {
          if (el.value === "custom") customRowsEl.focus();
          renderPreview();
        });
      });
      customRowsEl.addEventListener("focus", function () {
        var customRadio = document.querySelector('input[name="rows"][value="custom"]');
        if (customRadio) customRadio.checked = true;
      });
      customRowsEl.addEventListener("input", function () {
        var customRadio = document.querySelector('input[name="rows"][value="custom"]');
        if (customRadio) customRadio.checked = true;
        renderPreview();
      });
      includeHeaderEl.addEventListener("change", renderPreview);
      langZh.addEventListener("click", function () { setLang("zh"); });
      langEn.addEventListener("click", function () { setLang("en"); });

      customRowsEl.value = "500000";
      lang = detectLang();
      applyI18n();

      if (typeof globalThis !== "undefined" && globalThis.__DUP_TEST) {
        globalThis.__scanXlsxFiles = scanXlsxFiles;
      }
    })();
  </script>
</body>
</html>
