<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CSV 切成 Excel</title>
  <style>
    :root {
      --bg: #f3efe6;
      --card: #fffdf8;
      --ink: #1f2430;
      --muted: #5c6474;
      --line: #d9d1c3;
      --accent: #1f5c4d;
      --accent-2: #2d7a66;
      --danger: #9b2c2c;
      --ok: #1f5c4d;
      --drop: #eef6f2;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background:
        radial-gradient(1200px 500px at 10% -10%, #e7f0ea 0%, transparent 50%),
        var(--bg);
      color: var(--ink);
      line-height: 1.55;
    }
    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 28px 20px 64px;
    }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 22px;
    }
    .top-text { flex: 1; min-width: 0; }
    h1 {
      font-size: 28px;
      font-weight: 700;
      margin: 0 0 8px;
      letter-spacing: 0.02em;
    }
    .lead {
      margin: 0;
      color: var(--muted);
      font-size: 16px;
    }
    .lang {
      display: flex;
      flex-shrink: 0;
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
      background: var(--card);
    }
    .lang button {
      background: transparent;
      color: var(--muted);
      border-radius: 0;
      padding: 8px 12px;
      font-weight: 650;
      font-size: 13px;
    }
    .lang button:hover { background: #f3eee4; }
    .lang button.active {
      background: var(--accent);
      color: #fff;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(40, 32, 18, 0.06);
      padding: 22px;
    }
    .drop {
      border: 2px dashed #9bb8ae;
      background: var(--drop);
      border-radius: 14px;
      min-height: 220px;
      padding: 28px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 10px;
      transition: border-color 0.15s, background 0.15s, transform 0.15s;
      cursor: pointer;
    }
    .drop.drag {
      border-color: var(--accent);
      background: #dff0e8;
      transform: scale(1.01);
    }
    .drop.busy {
      cursor: not-allowed;
      opacity: 0.72;
    }
    .drop-title { font-size: 22px; font-weight: 700; }
    .drop-sub { color: var(--muted); font-size: 15px; }
    button {
      appearance: none;
      border: 0;
      background: var(--accent);
      color: white;
      font: inherit;
      font-weight: 650;
      padding: 10px 18px;
      border-radius: 10px;
      cursor: pointer;
    }
    button:hover { background: var(--accent-2); }
    button:disabled { cursor: not-allowed; opacity: 0.55; }
    .btn-secondary {
      background: #ece6da;
      color: var(--ink);
    }
    .btn-secondary:hover { background: #e0d8c8; }
    .controls {
      margin-top: 16px;
      display: grid;
      gap: 14px;
      padding: 14px 4px 4px;
      border-top: 1px solid var(--line);
    }
    .field-label {
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 8px;
    }
    .row-picks {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .row-picks label.chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 12px;
      background: #fff;
      cursor: pointer;
      font-size: 14px;
    }
    .row-picks label.chip:has(input:checked) {
      border-color: var(--accent);
      background: #e7f4ee;
      font-weight: 650;
    }
    .row-picks input[type="radio"] { accent-color: var(--accent); }
    .custom-wrap {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    #customRows {
      width: 8.5rem;
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font: inherit;
    }
    .check {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      cursor: pointer;
    }
    .check input { accent-color: var(--accent); width: 16px; height: 16px; }
    .preview {
      display: none;
      margin-top: 16px;
      padding: 14px 16px;
      border-radius: 12px;
      background: #eef6f2;
      border: 1px solid #cfe0d7;
    }
    .preview.show { display: block; }
    .preview-name { font-weight: 700; word-break: break-all; }
    .preview-meta { color: var(--muted); font-size: 14px; margin-top: 4px; }
    .preview-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }
    .status {
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: 12px;
      background: #f7f4ee;
      color: var(--ink);
      min-height: 52px;
      white-space: pre-wrap;
    }
    .status.err { background: #fdeeee; color: var(--danger); }
    .status.ok { background: #e7f4ee; color: var(--ok); }
    .bar {
      margin-top: 12px;
      height: 10px;
      background: #e6e0d4;
      border-radius: 99px;
      overflow: hidden;
      display: none;
    }
    .bar.show { display: block; }
    .bar > span {
      display: block;
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.2s;
    }
    .hints {
      margin: 18px 4px 0;
      color: var(--muted);
      font-size: 14px;
    }
    .hints li { margin: 6px 0; }
    input[type="file"] { display: none; }
    fieldset {
      border: 0;
      margin: 0;
      padding: 0;
      min-width: 0;
    }
    fieldset:disabled { opacity: 0.55; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="top-text">
        <h1 id="title"></h1>
        <p class="lead" id="lead"></p>
      </div>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" id="langZh">中文</button>
        <button type="button" id="langEn">English</button>
      </div>
    </div>
    <div class="card">
      <div id="drop" class="drop" role="button" tabindex="0">
        <div class="drop-title" id="dropTitle"></div>
        <div class="drop-sub" id="dropSub"></div>
        <button id="pick" type="button"></button>
      </div>
      <fieldset id="settings">
        <div class="controls">
          <div>
            <div class="field-label" id="rowsLabel"></div>
            <div class="row-picks">
              <label class="chip"><input type="radio" name="rows" value="100000" /> <span id="rows100k"></span></label>
              <label class="chip"><input type="radio" name="rows" value="500000" checked /> <span id="rows500k"></span></label>
              <label class="chip"><input type="radio" name="rows" value="1000000" /> <span id="rows1m"></span></label>
              <label class="chip custom-wrap">
                <input type="radio" name="rows" value="custom" />
                <span id="rowsCustom"></span>
                <input id="customRows" type="number" min="1" step="1" inputmode="numeric" />
              </label>
            </div>
          </div>
          <label class="check">
            <input id="includeHeader" type="checkbox" checked />
            <span id="headerLabel"></span>
          </label>
        </div>
      </fieldset>
      <div id="preview" class="preview">
        <div class="preview-name" id="previewName"></div>
        <div class="preview-meta" id="previewMeta"></div>
        <div class="preview-actions">
          <button id="startBtn" type="button"></button>
          <button id="clearBtn" type="button" class="btn-secondary"></button>
        </div>
      </div>
      <div id="bar" class="bar" aria-hidden="true"><span id="barFill"></span></div>
      <div id="status" class="status"></div>
    </div>
    <ul class="hints">
      <li id="hint1"></li>
      <li id="hint2"></li>
      <li id="hint3"></li>
    </ul>
  </div>
  <input id="file" type="file" accept=".csv,text/csv" />

  <script>
    (function () {
      "use strict";

      var XML_BATCH = 65536;
      var EXCEL_MAX_ROWS = 1048576;
      var busy = false;
      var selectedFile = null;
      var skippedExtra = false;
      var lang = "zh";
      var statusKind = "";
      var statusKey = "idle";
      var statusVars = {};
      var progressSnap = null;

      var I18N = {
        zh: {
          title: "把大型 CSV 切成多個 Excel",
          docTitle: "CSV 切成 Excel",
          lead: "不必安裝任何程式。把 CSV 拖進下面的框，確認設定後再開始。完成後會下載一個 zip。",
          dropTitle: "把 CSV 拖到這裡",
          dropSub: "或按下面按鈕選擇檔案。一次請只處理一個 CSV。",
          pick: "選擇檔案",
          rowsLabel: "每個 Excel 幾筆",
          rows100k: "10 萬",
          rows500k: "50 萬",
          rows1m: "100 萬",
          rowsCustom: "自訂",
          headerLabel: "每個 Excel 都放表頭",
          start: "開始切檔",
          clear: "換一個檔",
          hint1: "請用 Chrome、Edge、Safari 或 Firefox。檔案很大時可能需要幾分鐘，請勿關閉分頁。",
          hint2: "結果會做成一個 zip，裡面是 part_001.xlsx、part_002.xlsx…",
          hint3: "不會覆蓋你電腦裡的舊檔；瀏覽器下載資料夾若有同名，會自動加 (1)。",
          idle: "等待檔案中。選好檔案後會先預覽，不會立刻開始。Mac 若無法雙擊啟動檔，請用右鍵開啟。",
          previewMeta: "大小 {size}。依目前設定，大約會切成 {parts} 個 Excel（粗估，實際以資料列為準）。",
          extraFiles: "一次請只拖一個 CSV。已忽略多出來的檔案，只使用「{name}」。",
          needCsv: "請拖入 .csv 檔。",
          needCsvOther: "請拖入 .csv 檔。其他類型無法轉換。",
          badRows: "「每個 Excel 幾筆」請輸入 1 到 {max} 的整數。",
          busyWait: "正在處理中，請等這次完成。請勿關閉這個分頁。",
          startMsg: "開始處理「{name}」。檔案很大時可能需要幾分鐘，請勿關閉這個分頁。",
          leave: "正在處理，關閉會中斷。",
          progressWarn: "檔案很大，可能需要幾分鐘。請勿關閉這個分頁。",
          progressStats: "已讀 {pct}%　已處理 {rows} 筆　已完成 {parts} 個 Excel",
          reading: "正在讀取 CSV…",
          writingExcel: "正在讀取並寫入 Excel…",
          writingPart: "正在寫 {name} …",
          packing: "正在打包 zip…\n共 {rows} 筆，分成 {parts} 個 Excel。",
          done: "完成，共產生 {parts} 個 Excel，共 {rows} 筆。\n已開始下載：{zip}",
          fail: "處理失敗：{msg}",
          oldBrowser: "這個瀏覽器太舊了，請改用較新的 Chrome、Edge、Safari 或 Firefox。",
          noHeader: "讀不到表頭，請確認這是文字 CSV 檔。",
          noData: "這個檔案沒有資料。",
          memory: "記憶體不足。請關閉其他分頁後再試，或把 CSV 先切小一點。",
          sheetName: "資料"
        },
        en: {
          title: "Split a large CSV into Excel files",
          docTitle: "CSV to Excel",
          lead: "No install needed. Drop a CSV below, check the settings, then start. When it finishes, a zip file downloads.",
          dropTitle: "Drop your CSV here",
          dropSub: "Or click the button to choose a file. Please use one CSV at a time.",
          pick: "Choose file",
          rowsLabel: "Rows per Excel file",
          rows100k: "100,000",
          rows500k: "500,000",
          rows1m: "1,000,000",
          rowsCustom: "Custom",
          headerLabel: "Repeat the header in every Excel file",
          start: "Start splitting",
          clear: "Choose another file",
          hint1: "Use Chrome, Edge, Safari, or Firefox. Large files can take a few minutes. Do not close this tab.",
          hint2: "You will get one zip containing part_001.xlsx, part_002.xlsx, and so on.",
          hint3: "Old downloads are not overwritten. If the name already exists, the browser adds (1).",
          idle: "Waiting for a file. After you choose one, you will see a preview — it will not start yet. On a Mac, if the launcher is blocked, right-click to open it.",
          previewMeta: "Size {size}. With the current settings this will be about {parts} Excel file(s) (rough estimate).",
          extraFiles: "Please drop only one CSV. Extra files were ignored. Using “{name}”.",
          needCsv: "Please drop a .csv file.",
          needCsvOther: "Please drop a .csv file. Other types cannot be converted.",
          badRows: "Rows per file must be a whole number from 1 to {max}.",
          busyWait: "Still working. Please wait, and do not close this tab.",
          startMsg: "Starting “{name}”. Large files can take a few minutes. Do not close this tab.",
          leave: "Work is in progress. Closing this tab will stop it.",
          progressWarn: "This file is large and may take a few minutes. Do not close this tab.",
          progressStats: "Read {pct}%   {rows} rows processed   {parts} Excel file(s) done",
          reading: "Reading CSV…",
          writingExcel: "Reading and writing Excel…",
          writingPart: "Writing {name} …",
          packing: "Creating zip…\n{rows} rows in {parts} Excel file(s).",
          done: "Done. Created {parts} Excel file(s), {rows} rows in total.\nDownload started: {zip}",
          fail: "Could not finish: {msg}",
          oldBrowser: "This browser is too old. Please use a recent Chrome, Edge, Safari, or Firefox.",
          noHeader: "Could not read a header row. Please make sure this is a text CSV file.",
          noData: "This file has no data rows.",
          memory: "Not enough memory. Close other tabs and try again, or split the CSV into a smaller file first.",
          sheetName: "Data"
        }
      };

      var drop = document.getElementById("drop");
      var pick = document.getElementById("pick");
      var fileInput = document.getElementById("file");
      var statusEl = document.getElementById("status");
      var bar = document.getElementById("bar");
      var barFill = document.getElementById("barFill");
      var settings = document.getElementById("settings");
      var includeHeaderEl = document.getElementById("includeHeader");
      var customRowsEl = document.getElementById("customRows");
      var preview = document.getElementById("preview");
      var previewName = document.getElementById("previewName");
      var previewMeta = document.getElementById("previewMeta");
      var startBtn = document.getElementById("startBtn");
      var clearBtn = document.getElementById("clearBtn");
      var langZh = document.getElementById("langZh");
      var langEn = document.getElementById("langEn");
      var encoder = new TextEncoder();

      function t(key) {
        var pack = I18N[lang] || I18N.zh;
        if (pack[key] != null) return pack[key];
        return I18N.zh[key] || key;
      }

      function tf(key, vars) {
        var s = t(key);
        if (!vars) return s;
        Object.keys(vars).forEach(function (k) {
          s = s.split("{" + k + "}").join(String(vars[k]));
        });
        return s;
      }

      function locale() {
        return lang === "en" ? "en" : "zh-Hant";
      }

      function applyI18n() {
        document.documentElement.lang = lang === "en" ? "en" : "zh-Hant";
        document.title = t("docTitle");
        document.getElementById("title").textContent = t("title");
        document.getElementById("lead").textContent = t("lead");
        document.getElementById("dropTitle").textContent = t("dropTitle");
        document.getElementById("dropSub").textContent = t("dropSub");
        drop.setAttribute("aria-label", t("dropTitle"));
        pick.textContent = t("pick");
        document.getElementById("rowsLabel").textContent = t("rowsLabel");
        document.getElementById("rows100k").textContent = t("rows100k");
        document.getElementById("rows500k").textContent = t("rows500k");
        document.getElementById("rows1m").textContent = t("rows1m");
        document.getElementById("rowsCustom").textContent = t("rowsCustom");
        document.getElementById("headerLabel").textContent = t("headerLabel");
        startBtn.textContent = t("start");
        clearBtn.textContent = t("clear");
        document.getElementById("hint1").textContent = t("hint1");
        document.getElementById("hint2").textContent = t("hint2");
        document.getElementById("hint3").textContent = t("hint3");
        langZh.className = lang === "zh" ? "active" : "";
        langEn.className = lang === "en" ? "active" : "";
        customRowsEl.placeholder = t("rowsCustom");
        renderPreview();
        renderStatus();
      }

      function detectLang() {
        try {
          var saved = localStorage.getItem("csvSplitLang");
          if (saved === "en" || saved === "zh") return saved;
        } catch (e) {}
        var nav = String(navigator.language || navigator.userLanguage || "").toLowerCase();
        return nav.indexOf("en") === 0 ? "en" : "zh";
      }

      function setLang(next) {
        lang = next === "en" ? "en" : "zh";
        try { localStorage.setItem("csvSplitLang", lang); } catch (e) {}
        applyI18n();
      }

      function setStatusKey(key, vars, kind) {
        statusKey = key;
        statusVars = vars || {};
        statusKind = kind || "";
        progressSnap = null;
        renderStatus();
      }

      function renderStatus() {
        var text;
        if (progressSnap) {
          text =
            t("progressWarn") + "\n" +
            progressSnap.msg + "\n" +
            tf("progressStats", {
              pct: progressSnap.pct,
              rows: progressSnap.rows.toLocaleString(locale()),
              parts: String(progressSnap.parts)
            });
        } else {
          var vars = statusVars;
          if (statusVars.rowsRaw != null) {
            vars = {
              rows: Number(statusVars.rowsRaw).toLocaleString(locale()),
              parts: String(statusVars.parts),
              zip: statusVars.zip || "",
              name: statusVars.name || "",
              max: statusVars.max || "",
              msg: statusVars.msg || ""
            };
          }
          text = tf(statusKey, vars);
        }
        statusEl.textContent = text;
        statusEl.className = "status" + (statusKind ? " " + statusKind : "");
      }

      var crcTable = (function () {
        var table = new Uint32Array(256);
        for (var n = 0; n < 256; n++) {
          var c = n;
          for (var k = 0; k < 8; k++) {
            c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
          }
          table[n] = c >>> 0;
        }
        return table;
      })();

      function crc32Update(crc, u8) {
        crc = crc ^ 0xFFFFFFFF;
        for (var i = 0; i < u8.length; i++) {
          crc = crcTable[(crc ^ u8[i]) & 0xFF] ^ (crc >>> 8);
        }
        return (crc ^ 0xFFFFFFFF) >>> 0;
      }

      function crc32(u8) {
        return crc32Update(0, u8);
      }

      function ZipWriter() {
        this.parts = [];
        this.entries = [];
        this.offset = 0;
      }

      ZipWriter.prototype.push = function (part) {
        this.parts.push(part);
        this.offset += part.byteLength != null ? part.byteLength : part.size;
      };

      ZipWriter.prototype.add = function (filename, data, method, crc, uncompressedSize) {
        var nameBytes = encoder.encode(filename);
        var localOffset = this.offset;
        var compressedSize = data.byteLength;
        if (uncompressedSize == null) uncompressedSize = compressedSize;
        if (crc == null) crc = crc32(data);

        var header = new Uint8Array(30 + nameBytes.length);
        var v = new DataView(header.buffer);
        v.setUint32(0, 0x04034b50, true);
        v.setUint16(4, 20, true);
        v.setUint16(6, 0x0800, true);
        v.setUint16(8, method, true);
        v.setUint16(10, 0, true);
        v.setUint16(12, 0, true);
        v.setUint32(14, crc, true);
        v.setUint32(18, compressedSize, true);
        v.setUint32(22, uncompressedSize, true);
        v.setUint16(26, nameBytes.length, true);
        v.setUint16(28, 0, true);
        header.set(nameBytes, 30);
        this.push(header);
        this.push(data);
        this.entries.push({
          nameBytes: nameBytes,
          method: method,
          crc: crc,
          compressedSize: compressedSize,
          uncompressedSize: uncompressedSize,
          offset: localOffset
        });
      };

      ZipWriter.prototype.addStored = function (filename, data) {
        this.add(filename, data, 0, crc32(data), data.length);
      };

      ZipWriter.prototype.finish = function (mime) {
        var cdStart = this.offset;
        for (var i = 0; i < this.entries.length; i++) {
          var e = this.entries[i];
          var cd = new Uint8Array(46 + e.nameBytes.length);
          var v = new DataView(cd.buffer);
          v.setUint32(0, 0x02014b50, true);
          v.setUint16(4, 20, true);
          v.setUint16(6, 20, true);
          v.setUint16(8, 0x0800, true);
          v.setUint16(10, e.method, true);
          v.setUint16(12, 0, true);
          v.setUint16(14, 0, true);
          v.setUint32(16, e.crc, true);
          v.setUint32(20, e.compressedSize, true);
          v.setUint32(24, e.uncompressedSize, true);
          v.setUint16(28, e.nameBytes.length, true);
          v.setUint16(30, 0, true);
          v.setUint16(32, 0, true);
          v.setUint16(34, 0, true);
          v.setUint16(36, 0, true);
          v.setUint32(38, 0, true);
          v.setUint32(42, e.offset, true);
          cd.set(e.nameBytes, 46);
          this.push(cd);
        }
        var cdSize = this.offset - cdStart;
        var eocd = new Uint8Array(22);
        var ev = new DataView(eocd.buffer);
        ev.setUint32(0, 0x06054b50, true);
        ev.setUint16(4, 0, true);
        ev.setUint16(6, 0, true);
        ev.setUint16(8, this.entries.length, true);
        ev.setUint16(10, this.entries.length, true);
        ev.setUint32(12, cdSize, true);
        ev.setUint32(16, cdStart, true);
        ev.setUint16(20, 0, true);
        this.push(eocd);
        return new Blob(this.parts, { type: mime || "application/zip" });
      };

      function xmlEscape(s) {
        return String(s)
          .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      function colName(index) {
        var n = index + 1;
        var s = "";
        while (n > 0) {
          var r = (n - 1) % 26;
          s = String.fromCharCode(65 + r) + s;
          n = Math.floor((n - 1) / 26);
        }
        return s;
      }

      function rowXml(rowIndex, cells) {
        var r = rowIndex + 1;
        var parts = ['<row r="' + r + '">'];
        for (var i = 0; i < cells.length; i++) {
          var ref = colName(i) + r;
          var text = xmlEscape(cells[i] == null ? "" : cells[i]);
          parts.push('<c r="' + ref + '" t="inlineStr"><is><t>' + text + "</t></is></c>");
        }
        parts.push("</row>");
        return parts.join("");
      }

      function createSheetWriter() {
        if (typeof CompressionStream !== "function") {
          throw new Error("OLD_BROWSER");
        }
        var cs = new CompressionStream("deflate-raw");
        var writer = cs.writable.getWriter();
        var compressedParts = [];
        var reader = cs.readable.getReader();
        var reading = (async function () {
          while (true) {
            var chunk = await reader.read();
            if (chunk.done) break;
            compressedParts.push(chunk.value);
          }
        })();
        var crc = 0;
        var uncompressedSize = 0;
        var pending = [];
        var pendingLen = 0;

        async function flush() {
          if (!pendingLen) return;
          var s = pending.join("");
          pending = [];
          pendingLen = 0;
          var u8 = encoder.encode(s);
          crc = crc32Update(crc, u8);
          uncompressedSize += u8.length;
          await writer.write(u8);
        }

        return {
          write: function (s) {
            pending.push(s);
            pendingLen += s.length;
            if (pendingLen >= XML_BATCH) return flush();
            return null;
          },
          finish: async function () {
            await flush();
            await writer.close();
            await reading;
            var total = 0;
            for (var i = 0; i < compressedParts.length; i++) total += compressedParts[i].length;
            var out = new Uint8Array(total);
            var o = 0;
            for (var j = 0; j < compressedParts.length; j++) {
              out.set(compressedParts[j], o);
              o += compressedParts[j].length;
            }
            return { data: out, crc: crc, uncompressedSize: uncompressedSize };
          }
        };
      }

      var CONTENT_TYPES = encoder.encode(
        '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
        '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
        '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
        '<Default Extension="xml" ContentType="application/xml"/>' +
        '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
        '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>' +
        "</Types>"
      );
      var RELS = encoder.encode(
        '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
        '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
        '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>' +
        "</Relationships>"
      );
      var WORKBOOK_RELS = encoder.encode(
        '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
        '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
        '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>' +
        "</Relationships>"
      );

      function workbookBytes() {
        var name = xmlEscape(t("sheetName"));
        return encoder.encode(
          '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
          '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
          "<sheets><sheet name=\"" + name + "\" sheetId=\"1\" r:id=\"rId1\"/></sheets>" +
          "</workbook>"
        );
      }

      async function finishXlsx(sheet) {
        var p = sheet.write("</sheetData></worksheet>");
        if (p) await p;
        var sheetBin = await sheet.finish();
        var zip = new ZipWriter();
        zip.addStored("[Content_Types].xml", CONTENT_TYPES);
        zip.addStored("_rels/.rels", RELS);
        zip.addStored("xl/workbook.xml", workbookBytes());
        zip.addStored("xl/_rels/workbook.xml.rels", WORKBOOK_RELS);
        zip.add("xl/worksheets/sheet1.xml", sheetBin.data, 8, sheetBin.crc, sheetBin.uncompressedSize);
        var blob = zip.finish("application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
        return new Uint8Array(await blob.arrayBuffer());
      }

      async function startSheet(header, includeHeader) {
        var sheet = createSheetWriter();
        var xml =
          '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
          '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
          "<sheetData>";
        if (includeHeader) xml += rowXml(0, header);
        var p = sheet.write(xml);
        if (p) await p;
        return sheet;
      }

      function createCsvState() {
        return { field: "", row: [], inQuotes: false, pendingCR: false, skipLF: false };
      }

      function skipEmpty(row) {
        return !(row.length === 1 && row[0] === "");
      }

      function endRow(state, rows) {
        state.row.push(state.field);
        state.field = "";
        if (skipEmpty(state.row)) rows.push(state.row);
        state.row = [];
      }

      function appendPartialUnquoted(state, piece) {
        var extra = piece.split(",");
        state.field += extra[0];
        for (var k = 1; k < extra.length; k++) {
          state.row.push(state.field);
          state.field = extra[k];
        }
      }

      function finishUnquotedLine(state, piece, rows) {
        appendPartialUnquoted(state, piece);
        endRow(state, rows);
      }

      function parseUnquoted(state, text, rows) {
        var i = 0;
        if (state.skipLF) {
          state.skipLF = false;
          if (text.length && text.charCodeAt(0) === 10) i = 1;
        }
        var start = i;
        for (; i < text.length; i++) {
          var code = text.charCodeAt(i);
          if (code === 10) {
            finishUnquotedLine(state, text.slice(start, i), rows);
            start = i + 1;
          } else if (code === 13) {
            finishUnquotedLine(state, text.slice(start, i), rows);
            if (i + 1 < text.length && text.charCodeAt(i + 1) === 10) {
              i++;
            } else if (i === text.length - 1) {
              state.skipLF = true;
            }
            start = i + 1;
          }
        }
        if (start < text.length) appendPartialUnquoted(state, text.slice(start));
      }

      function parseQuoted(state, text, rows) {
        for (var i = 0; i < text.length; i++) {
          var c = text[i];
          if (state.pendingCR) {
            state.pendingCR = false;
            if (c === "\n") {
              endRow(state, rows);
              continue;
            }
            endRow(state, rows);
          }
          if (state.inQuotes) {
            if (c === '"') {
              if (text[i + 1] === '"') {
                state.field += '"';
                i++;
              } else {
                state.inQuotes = false;
              }
            } else {
              state.field += c;
            }
          } else if (c === '"') {
            state.inQuotes = true;
          } else if (c === ",") {
            state.row.push(state.field);
            state.field = "";
          } else if (c === "\n") {
            endRow(state, rows);
          } else if (c === "\r") {
            state.pendingCR = true;
          } else {
            state.field += c;
          }
        }
      }

      function parseText(state, text, rows) {
        if (!state.inQuotes && text.indexOf('"') === -1) parseUnquoted(state, text, rows);
        else parseQuoted(state, text, rows);
      }

      function flushCsv(state, rows) {
        if (state.pendingCR) {
          state.pendingCR = false;
          endRow(state, rows);
        }
        if (state.field !== "" || state.row.length) endRow(state, rows);
      }

      async function readChunks(file) {
        if (typeof file.stream === "function") {
          var reader = file.stream().getReader();
          return {
            next: function () { return reader.read(); }
          };
        }
        var pos = 0;
        var size = 8 * 1024 * 1024;
        return {
          next: async function () {
            if (pos >= file.size) return { done: true, value: undefined };
            var end = Math.min(pos + size, file.size);
            var buf = await file.slice(pos, end).arrayBuffer();
            pos = end;
            return { done: false, value: new Uint8Array(buf) };
          }
        };
      }

      function padPart(n) {
        var s = String(n);
        while (s.length < 3) s = "0" + s;
        return s;
      }

      function stamp() {
        var d = new Date();
        function z(n) { return n < 10 ? "0" + n : String(n); }
        return d.getFullYear() + z(d.getMonth() + 1) + z(d.getDate()) + "_" +
          z(d.getHours()) + z(d.getMinutes()) + z(d.getSeconds());
      }

      function baseName(name) {
        return String(name || "csv").replace(/\.[^.]+$/, "").replace(/[\\/:*?"<>|]/g, "_");
      }

      function isCsv(file) {
        var n = (file && file.name ? file.name : "").toLowerCase();
        return n.endsWith(".csv");
      }

      function formatSize(n) {
        if (n < 1024) return n + " B";
        if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
        return (n / (1024 * 1024)).toFixed(1) + " MB";
      }

      function headerOn() {
        return includeHeaderEl.checked;
      }

      function maxDataRows() {
        return headerOn() ? EXCEL_MAX_ROWS - 1 : EXCEL_MAX_ROWS;
      }

      function selectedRowMode() {
        var el = document.querySelector('input[name="rows"]:checked');
        return el ? el.value : "500000";
      }

      function parseRowsPerFile() {
        var mode = selectedRowMode();
        var n;
        if (mode === "custom") n = Number(String(customRowsEl.value).replace(/[, ]/g, ""));
        else n = Number(mode);
        if (!isFinite(n) || n < 1 || Math.floor(n) !== n) return null;
        if (n > maxDataRows()) return null;
        return n;
      }

      function setProgress(pct) {
        bar.classList.add("show");
        barFill.style.width = Math.max(0, Math.min(100, pct)) + "%";
      }

      function hideProgress() {
        bar.classList.remove("show");
        barFill.style.width = "0%";
      }

      var lastYield = 0;
      async function maybeYield() {
        var now = performance.now();
        if (now - lastYield > 40) {
          lastYield = now;
          await new Promise(function (resolve) { setTimeout(resolve, 0); });
        }
      }

      async function processFile(file, rowsPerFile, includeHeader) {
        var decoder = new TextDecoder("utf-8");
        var csv = createCsvState();
        var chunks = await readChunks(file);
        var header = null;
        var totalRows = 0;
        var part = 0;
        var rowsInPart = 0;
        var bytes = 0;
        var outer = new ZipWriter();
        var sheet = null;
        var lastUi = 0;

        function ui(msg, force) {
          var now = performance.now();
          if (!force && now - lastUi < 250) return;
          lastUi = now;
          var pct = file.size ? Math.min(100, Math.round((bytes / Math.max(file.size, 1)) * 100)) : 0;
          setProgress(file.size ? (bytes / file.size) * 88 : 0);
          progressSnap = {
            msg: msg,
            pct: pct,
            rows: totalRows,
            parts: part
          };
          statusKind = "";
          renderStatus();
        }

        async function closePart() {
          if (!sheet || !rowsInPart) {
            sheet = null;
            rowsInPart = 0;
            return;
          }
          part += 1;
          ui(tf("writingPart", { name: "part_" + padPart(part) + ".xlsx" }), true);
          var xlsxBytes = await finishXlsx(sheet);
          outer.addStored("part_" + padPart(part) + ".xlsx", xlsxBytes);
          sheet = null;
          rowsInPart = 0;
          await maybeYield();
        }

        async function consume(rows) {
          for (var i = 0; i < rows.length; i++) {
            var row = rows[i];
            if (header == null) {
              if (row[0] && row[0].charCodeAt(0) === 0xFEFF) row[0] = row[0].slice(1);
              header = row;
              continue;
            }
            if (!sheet) {
              sheet = await startSheet(header, includeHeader);
            }
            rowsInPart += 1;
            totalRows += 1;
            var excelRow = includeHeader ? rowsInPart : rowsInPart - 1;
            var p = sheet.write(rowXml(excelRow, row));
            if (p) await p;
            if (rowsInPart >= rowsPerFile) await closePart();
            else if ((totalRows & 16383) === 0) {
              ui(t("writingExcel"));
              await maybeYield();
            }
          }
        }

        while (true) {
          var step = await chunks.next();
          var rows = [];
          if (step.done) {
            var tail = decoder.decode();
            if (tail) parseText(csv, tail, rows);
            flushCsv(csv, rows);
            await consume(rows);
            break;
          }
          bytes += step.value.length;
          var text = decoder.decode(step.value, { stream: true });
          parseText(csv, text, rows);
          await consume(rows);
          ui(t("reading"));
        }

        if (!header) throw new Error("NO_HEADER");
        await closePart();
        if (!part || totalRows === 0) throw new Error("NO_DATA");

        setProgress(96);
        progressSnap = null;
        setStatusKey("packing", {
          rowsRaw: totalRows,
          parts: part
        });
        var zipBlob = outer.finish();
        var zipName = baseName(file.name) + "_excel_" + stamp() + ".zip";
        downloadBlob(zipBlob, zipName);
        setProgress(100);
        setStatusKey("done", {
          parts: part,
          rowsRaw: totalRows,
          zip: zipName
        }, "ok");
      }

      function downloadBlob(blob, name) {
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = name;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 15000);
      }

      function mapError(err) {
        var raw = err && err.message ? err.message : String(err);
        if (raw === "OLD_BROWSER") return t("oldBrowser");
        if (raw === "NO_HEADER") return t("noHeader");
        if (raw === "NO_DATA") return t("noData");
        if (/memory|heap|allocation/i.test(raw)) return t("memory");
        return raw;
      }

      function estimateParts(file, rowsPerFile) {
        if (!file || !rowsPerFile) return 1;
        var estRows = Math.max(1, Math.round(file.size / 56) - 1);
        return Math.max(1, Math.ceil(estRows / rowsPerFile));
      }

      function renderPreview() {
        if (!selectedFile) {
          preview.classList.remove("show");
          return;
        }
        preview.classList.add("show");
        previewName.textContent = selectedFile.name;
        var rows = parseRowsPerFile() || 500000;
        previewMeta.textContent = tf("previewMeta", {
          size: formatSize(selectedFile.size),
          parts: String(estimateParts(selectedFile, rows))
        });
      }

      function clearFile() {
        selectedFile = null;
        skippedExtra = false;
        fileInput.value = "";
        preview.classList.remove("show");
        hideProgress();
        setStatusKey("idle");
      }

      function chooseFile(file, extra) {
        selectedFile = file;
        skippedExtra = !!extra;
        hideProgress();
        renderPreview();
        if (extra) setStatusKey("extraFiles", { name: file.name });
        else setStatusKey("idle");
      }

      function lockUi(on) {
        busy = on;
        settings.disabled = on;
        pick.disabled = on;
        startBtn.disabled = on;
        clearBtn.disabled = on;
        if (on) drop.classList.add("busy");
        else drop.classList.remove("busy");
      }

      async function startSplit() {
        if (busy) return;
        if (!selectedFile) {
          setStatusKey("needCsv", {}, "err");
          return;
        }
        var rowsPerFile = parseRowsPerFile();
        if (!rowsPerFile) {
          setStatusKey("badRows", { max: String(maxDataRows()) }, "err");
          return;
        }
        lockUi(true);
        window.onbeforeunload = function () { return t("leave"); };
        setProgress(1);
        setStatusKey("startMsg", { name: selectedFile.name });
        try {
          await processFile(selectedFile, rowsPerFile, headerOn());
        } catch (err) {
          hideProgress();
          setStatusKey("fail", { msg: mapError(err) }, "err");
        } finally {
          lockUi(false);
          window.onbeforeunload = null;
        }
      }

      function pickFromList(files) {
        if (busy) {
          setStatusKey("busyWait");
          return;
        }
        var list = Array.prototype.slice.call(files || []);
        if (!list.length) return;
        var csvs = list.filter(isCsv);
        if (!csvs.length) {
          setStatusKey("needCsvOther", {}, "err");
          return;
        }
        chooseFile(csvs[0], list.length > 1);
      }

      drop.addEventListener("dragenter", function (e) {
        e.preventDefault();
        if (!busy) drop.classList.add("drag");
      });
      drop.addEventListener("dragover", function (e) {
        e.preventDefault();
        if (!busy) drop.classList.add("drag");
      });
      drop.addEventListener("dragleave", function (e) {
        if (e.target === drop) drop.classList.remove("drag");
      });
      drop.addEventListener("drop", function (e) {
        e.preventDefault();
        drop.classList.remove("drag");
        pickFromList(e.dataTransfer && e.dataTransfer.files);
      });
      document.addEventListener("dragover", function (e) { e.preventDefault(); });
      document.addEventListener("drop", function (e) {
        if (e.target === drop || drop.contains(e.target)) return;
        e.preventDefault();
        pickFromList(e.dataTransfer && e.dataTransfer.files);
      });

      pick.addEventListener("click", function (e) {
        e.preventDefault();
        e.stopPropagation();
        if (!busy) fileInput.click();
      });
      drop.addEventListener("click", function (e) {
        if (e.target === pick) return;
        if (!busy) fileInput.click();
      });
      drop.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          if (!busy) fileInput.click();
        }
      });
      fileInput.addEventListener("change", function () {
        pickFromList(fileInput.files);
        fileInput.value = "";
      });
      startBtn.addEventListener("click", function (e) {
        e.preventDefault();
        startSplit();
      });
      clearBtn.addEventListener("click", function (e) {
        e.preventDefault();
        if (!busy) clearFile();
      });
      document.querySelectorAll('input[name="rows"]').forEach(function (el) {
        el.addEventListener("change", function () {
          if (el.value === "custom") customRowsEl.focus();
          renderPreview();
        });
      });
      customRowsEl.addEventListener("focus", function () {
        var customRadio = document.querySelector('input[name="rows"][value="custom"]');
        if (customRadio) customRadio.checked = true;
      });
      customRowsEl.addEventListener("input", function () {
        var customRadio = document.querySelector('input[name="rows"][value="custom"]');
        if (customRadio) customRadio.checked = true;
        renderPreview();
      });
      includeHeaderEl.addEventListener("change", renderPreview);
      langZh.addEventListener("click", function () { setLang("zh"); });
      langEn.addEventListener("click", function () { setLang("en"); });

      customRowsEl.value = "500000";
      lang = detectLang();
      applyI18n();
    })();
  </script>
</body>
</html>
